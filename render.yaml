# Render Blueprint: Render panelinde "New > Blueprint" ile bu depoyu seçin.
# Veritabanı: MongoDB Atlas (MONGODB_URI). Render'da ayrıca veritabanı oluşturulmaz.
services:
  - type: web
    name: vip-transfer
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:remote
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # MongoDB Atlas bağlantı adresi. Panelden girilir, dosyaya yazılmaz.
      - key: MONGODB_URI
        sync: false
