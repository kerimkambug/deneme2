# Render Blueprint: Render panelinde "New > Blueprint" ile bu depoyu seçin.
services:
  - type: web
    name: vip-transfer
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:remote
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # MongoDB Atlas bağlantısı (önerilen). Panelden girilir, dosyaya yazılmaz.
      - key: MONGODB_URI
        sync: false
      # Eski Render PostgreSQL: MONGODB_URI verilince ilk açılışta veriler buradan MongoDB'ye taşınır
      - key: DATABASE_URL
        fromDatabase:
          name: vip-transfer-db
          property: connectionString

databases:
  - name: vip-transfer-db
    plan: free
    region: frankfurt
